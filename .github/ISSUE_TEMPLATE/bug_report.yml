name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! English or Spanish are both fine.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Library / catalog
        - Game Center / manuals
        - Plays / score sheets
        - Live shared plays / friends / groups
        - Stats
        - Camera recognition / barcode
        - Account / settings / languages
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Device and browser
      placeholder: e.g. Android 15, Chrome 140 (installed as app)
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Remove any personal data before pasting.
