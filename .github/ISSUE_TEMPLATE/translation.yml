name: Translation
description: Fix a translation or propose a new language
labels: ["i18n"]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: e.g. French, or a new one such as Italian
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What should change?
      description: Current text, where it appears, and the suggested wording.
    validations:
      required: true
